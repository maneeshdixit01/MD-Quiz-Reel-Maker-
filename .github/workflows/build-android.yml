name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets (www)
        run: npm run build

      - name: Add Android Platform & Sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Install Native Android Hindi TTS Plugin
        run: |
          JAVA_DIR="android/app/src/main/java/com/md/quizreelmaker"
          mkdir -p "$JAVA_DIR"
          cp -f NativeTtsPlugin.java "$JAVA_DIR/NativeTtsPlugin.java"
          cp -f MainActivity.java "$JAVA_DIR/MainActivity.java"

      - name: Configure AndroidManifest Permissions & TTS Service Query
        run: |
          python3 - <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              xml = f.read()

          perms = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
          ]
          inject = []
          for p in perms:
              name = p.split('android:name="')[1].split('"')[0]
              if name not in xml:
                  inject.append("    " + p)

          if "android.intent.action.TTS_SERVICE" not in xml:
              inject.append(
                  "    <queries>\n"
                  "        <intent>\n"
                  "            <action android:name=\"android.intent.action.TTS_SERVICE\" />\n"
                  "        </intent>\n"
                  "    </queries>"
              )

          if inject:
              block = "\n".join(inject) + "\n\n    <application"
              xml = xml.replace("<application", block, 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(xml)
          PY

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MD-Quiz-Reel-Maker-v9-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
